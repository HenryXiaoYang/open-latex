name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check || true
      - run: cargo build --workspace --release
      - run: cargo test --workspace --lib
      - run: scripts/check-abi.sh
      - run: cc -Iinclude examples/c/edit_loop.c -Ltarget/release -llode_core -lpthread -ldl -lm -o /tmp/edit_loop
  integration:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache TeX Live
        id: tl
        uses: actions/cache@v4
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - name: Install TeX Live
        if: steps.tl.outputs.cache-hit != 'true'
        run: scripts/install-texlive.sh
      - name: Write env
        run: scripts/install-texlive.sh > /dev/null && cat build/texlive.env >> "$GITHUB_ENV" && echo "$PWD/build/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - run: pip install --break-system-packages pymupdf
      - run: texlua tex/tests/run.lua
      - run: cargo test --workspace --release
      - name: Fidelity (pure fixture, all three layers)
        run: |
          cargo run --release -p lode-cli -- gen-book --pages 10 --out build/fx/book-10-pure
          cargo run --release -p lode-cli -- verify --project build/fx/book-10-pure --raster --json-out build/verify.json
          cargo run --release -p lode-cli -- gen-book --pages 10 --variant units --fonts lm-tfm --out build/fx/book-10-units
          cargo run --release -p lode-cli -- verify --project build/fx/book-10-units --json-out build/verify-units.json
      - name: Export equality
        run: cargo run --release -p lode-cli -- export --project build/fx/book-10-pure --out build/export.pdf --check
      - uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            build/verify.json
            build/verify-units.json
  perf:
    runs-on: ubuntu-24.04
    needs: integration
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - run: scripts/install-texlive.sh > /dev/null && cat build/texlive.env >> "$GITHUB_ENV"
      - name: Benchmarks (smoke; gates are hardware-qualified)
        run: |
          for n in 10 100 300; do cargo run --release -p lode-cli -- gen-book --pages $n --fonts lm-tfm --out fixtures/book-$n-pure-lmtfm; done
          for n in 10 100; do cargo run --release -p lode-cli -- gen-book --pages $n --variant units --fonts lm-tfm --out fixtures/book-$n-units-lmtfm; done
          cargo run --release -p lode-cli -- bench --quick --project fixtures/book-10-pure-lmtfm fixtures/book-100-pure-lmtfm fixtures/book-300-pure-lmtfm fixtures/book-10-units-lmtfm fixtures/book-100-units-lmtfm --categories short,medium,long,inline-math,display-math,footnote,list,figure,table,heading --out build/bench-results || echo "::warning::performance gates failed on this runner"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: build/bench-results
