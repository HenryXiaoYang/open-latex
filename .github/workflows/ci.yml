name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check || true
      - run: cargo build --workspace --release
      - run: cargo test --workspace --lib
      - run: scripts/check-abi.sh
      - run: cc -Iinclude examples/c/edit_loop.c -Ltarget/release -lrtex_core -lpthread -ldl -lm -o /tmp/edit_loop
  integration:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache TeX Live
        id: tl
        uses: actions/cache@v4
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - name: Install TeX Live
        if: steps.tl.outputs.cache-hit != 'true'
        run: scripts/install-texlive.sh
      - name: Write env
        # texlive.env is a shell file (`export NAME="value"`); GITHUB_ENV wants bare NAME=value
        # lines and does not expand $PATH, so the PATH line goes through GITHUB_PATH instead.
        run: |
          scripts/install-texlive.sh > /dev/null
          grep -v '^export PATH=' build/texlive.env | sed -e 's/^export //' -e 's/"//g' >> "$GITHUB_ENV"
          echo "$PWD/build/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Install PyMuPDF for the interpreter the verifier runs
        run: python3 -m pip install --user --break-system-packages pymupdf && python3 -c "import pymupdf; print(pymupdf.__doc__)"
      - run: texlua tex/tests/run.lua
      - run: cargo test --workspace --release
      - name: Fidelity (pure fixture, all three layers)
        run: |
          cargo run --release -p rtex-cli -- gen-book --pages 10 --out build/fx/book-10-pure
          cargo run --release -p rtex-cli -- verify --project build/fx/book-10-pure --raster --json-out build/verify.json
          cargo run --release -p rtex-cli -- gen-book --pages 10 --variant units --fonts lm-tfm --out build/fx/book-10-units
          cargo run --release -p rtex-cli -- verify --project build/fx/book-10-units --json-out build/verify-units.json
      - name: Corpus (realistic documents, eligibility gate + row-exactness)
        run: |
          for d in cs:17 math:10 report:10 layout:10 code:8 multi:14 counters:9; do
            cargo run --release -p rtex-cli -- verify --project fixtures/corpus/${d%%:*} --build build/corpus/${d%%:*} --min-eligible ${d##*:}
          done
      - name: Picture cache (pictures reused across passes must leave units, placements and rendered pages unchanged)
        run: cargo run --release -p rtex-cli -- verify --project fixtures/corpus/pictures --build build/corpus/pictures --min-eligible 9 --pic-cache --min-cached 10 --raster
      - name: Probe mode (allow-list off, every difference must be caught by the row comparison)
        run: |
          cargo run --release -p rtex-cli -- verify --project fixtures/research/permissive --build build/research/permissive --permissive --min-eligible 28 --expect-differing 2
          for d in cs math report layout code multi pictures; do
            cargo run --release -p rtex-cli -- verify --project fixtures/corpus/$d --build build/research/corpus-$d --permissive
          done
          cargo run --release -p rtex-cli -- verify --project fixtures/corpus/counters --build build/research/corpus-counters --permissive --expect-differing 1
      - name: Export equality
        run: cargo run --release -p rtex-cli -- export --project build/fx/book-10-pure --out build/export.pdf --check
      - uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            build/verify.json
            build/verify-units.json
  perf:
    runs-on: ubuntu-24.04
    needs: integration
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - name: Write env
        # texlive.env is a shell file (`export NAME="value"`); GITHUB_ENV wants bare NAME=value
        # lines and does not expand $PATH, so the PATH line goes through GITHUB_PATH instead.
        run: |
          scripts/install-texlive.sh > /dev/null
          grep -v '^export PATH=' build/texlive.env | sed -e 's/^export //' -e 's/"//g' >> "$GITHUB_ENV"
          echo "$PWD/build/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Benchmarks (smoke; gates are hardware-qualified)
        run: |
          for n in 10 100 300; do cargo run --release -p rtex-cli -- gen-book --pages $n --fonts lm-tfm --out fixtures/book-$n-pure-lmtfm; done
          for n in 10 100; do cargo run --release -p rtex-cli -- gen-book --pages $n --variant units --fonts lm-tfm --out fixtures/book-$n-units-lmtfm; done
          cargo run --release -p rtex-cli -- bench --quick --project fixtures/book-10-pure-lmtfm fixtures/book-100-pure-lmtfm fixtures/book-300-pure-lmtfm fixtures/book-10-units-lmtfm fixtures/book-100-units-lmtfm --categories short,medium,long,inline-math,display-math,footnote,list,figure,table,heading --out build/bench-results || echo "::warning::performance gates failed on this runner"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: build/bench-results
