[workspace]
resolver = "2"
members = ["crates/rtex-dl", "crates/rtex-core", "crates/rtex-cli", "crates/rtex-verify"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/HenryXiaoYang/realtime-tex"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
regex = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
nix = { version = "0.29", features = ["fs", "poll", "signal", "process"] }
libc = "0.2"
lopdf = "0.36"
flate2 = "1"
ttf-parser = "0.25"
tiny-skia = "0.11"
png = "0.17"

[profile.release]
debug = 1

# Release archives (scripts/package.sh): no debug info, stripped, thin LTO.
[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "thin"
